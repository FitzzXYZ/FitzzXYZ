name: Auto-Update Profile Stats & LOC

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/frieren-total-loc.svg'
      - 'assets/mana-contribution-grid.svg'
      - 'assets/frieren-telemetry-ledger.svg'
      - 'assets/frieren-activity-graph.svg'
      - 'assets/frieren-adventurer-card.svg'
  schedule:
    - cron: '0 */3 * * *' # Runs automatically every 3 hours
  repository_dispatch:
    types: [update-loc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FitzzXYZ Profile Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recalculate LOC & Live GitHub Widgets
        env:
          LOC_TOKEN: ${{ secrets.LOC_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_loc.py

      - name: Commit & Push Updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/frieren-total-loc.svg assets/mana-contribution-grid.svg assets/frieren-telemetry-ledger.svg assets/frieren-activity-graph.svg assets/frieren-adventurer-card.svg
          git diff --staged --quiet || (git commit -m "chore(auto): update Total Kode & live profile stats [skip ci]" && git push)
