name: Update Total Lines of Code SVG

on:
  schedule:
    - cron: '0 17 * * *' # Runs daily at 00:00 WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FitzzXYZ Profile Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calculate LOC and regenerate SVG
        env:
          LOC_TOKEN: ${{ secrets.LOC_TOKEN }}
        run: python scripts/update_loc.py

      - name: Commit & Push updated LOC card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/frieren-total-loc.svg
          git diff --staged --quiet || (git commit -m "chore(loc): update daily total lines of code card" && git push)
