name: Polyglot CI (TypeScript, Go, Rust, SVG)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript Typecheck & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  go:
    name: Go Telemetry Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test -v ./...

  rust:
    name: Rust Combat Oracle Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked || cargo test

  svg-audit:
    name: Validate All SVG XML & README Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify SVG XML and local README asset paths
        run: |
          python - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path(".")
          svgs = sorted(root.rglob("*.svg"))
          for p in svgs:
              if "node_modules" in p.parts or ".tmp-dist" in p.parts:
                  continue
              ET.parse(p)
          readme = (root / "README.md").read_text(encoding="utf-8")
          missing = []
          for m in re.findall(r'src="(\./[^"]+)"', readme):
              if not (root / m).exists():
                  missing.append(m)
          assert not missing, f"Missing README assets: {missing}"
          print(f"Verified {len(svgs)} SVGs and all local README asset links.")
          PY
