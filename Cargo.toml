[package]
name = "fitzzxyz-oracle"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vercel_runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "oracle"
path = "api/oracle.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
