<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260">
  <defs>
    <clipPath id="lp1"><rect x="0" y="0" width="460" height="260" rx="12"/></clipPath>
    <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Geist Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  .h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.8px; fill: #F0F6FC; }
  .h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; fill: #F0F6FC; }
  .title { font-size: 15px; font-weight: 600; fill: #F0F6FC; }
  .body { font-size: 14px; font-weight: 400; fill: #9CA3AF; }
  .caption { font-size: 12px; font-weight: 500; fill: #6E7681; }
</style>
  </defs>
  <g clip-path="url(#lp1)">
    <rect x="0.5" y="0.5" width="459" height="259" rx="11.5" fill="#14181D" stroke="#242B33" stroke-width="1"/>

    <text x="24" y="38" class="sans h2">The philosophy of visualization</text>
    <text x="24" y="64" class="sans body" fill="#C9D1D9">“Magic is a world of visualization. If you cannot clearly see</text>
    <text x="24" y="84" class="sans body" fill="#C9D1D9">yourself cutting through it, the spell will never activate.”</text>

    <line x1="24" y1="102" x2="436" y2="102" stroke="#21262D" stroke-width="1"/>

    <text x="24" y="128" class="sans" font-size="13.5" fill="#9CA3AF">I approach software architecture the way Übel approaches</text>
    <text x="24" y="148" class="sans" font-size="13.5" fill="#9CA3AF">magic in Sousou no Frieren: visualize the entire system first,</text>
    <text x="24" y="168" class="sans" font-size="13.5" fill="#9CA3AF">then cut straight through the complexity.</text>

    <rect x="24" y="190" width="412" height="46" rx="8" fill="#1A2028"/>
    <text x="40" y="210" class="sans" font-size="12.5" font-weight="600" fill="#F0F6FC">Core focus</text>
    <text x="40" y="226" class="sans" font-size="12" fill="#8B949E">Full-stack web applications · REST APIs · Clean UI systems</text>
  </g>
</svg>