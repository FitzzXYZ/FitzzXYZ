    <text x="247" y="172" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#A1A1AA">STATUS: ACTIVE BUILDER  ·  IG: @FITZZ_XYZ  ·  GITHUB: @FITZZXYZ</text>
