      <rect x="20" y="92" width="233" height="28" rx="6" fill="#1A1E1A" stroke="#2A312A"/><circle cx="34" cy="106" r="3.5" fill="#8BA872"/><text x="48" y="110" class="sans" font-size="12.5" font-weight="600" fill="#E4E4E7">React.js &amp; Next.js</text>
