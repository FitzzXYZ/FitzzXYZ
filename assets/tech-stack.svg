<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%">
  <defs>
    <clipPath id="techOuter"><rect x="0" y="0" width="1200" height="310" rx="20"/></clipPath>
    <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Manrope', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
  .pulse { animation: pulseDot 2.8s ease-in-out infinite; }
</style>
  </defs>

  <g clip-path="url(#techOuter)">
    <rect x="0" y="0" width="1200" height="310" rx="20" fill="#0D0F0D"/>

