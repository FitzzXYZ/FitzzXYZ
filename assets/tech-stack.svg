<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <clipPath id="tOuter"><rect x="0" y="0" width="1200" height="260" rx="16"/></clipPath>
    <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Geist Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  .h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.8px; fill: #F0F6FC; }
  .h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; fill: #F0F6FC; }
  .title { font-size: 15px; font-weight: 600; fill: #F0F6FC; }
  .body { font-size: 14px; font-weight: 400; fill: #9CA3AF; }
  .caption { font-size: 12px; font-weight: 500; fill: #6E7681; }
</style>
  </defs>
  <g clip-path="url(#tOuter)">
    <rect x="0.5" y="0.5" width="1199" height="259" rx="15.5" fill="#14181D" stroke="#242B33" stroke-width="1"/>

    <text x="32" y="42" class="sans h2">Technical stack &amp; tooling</text>
    <line x1="32" y1="58" x2="1168" y2="58" stroke="#21262D" stroke-width="1"/>

    <!-- Col 1 -->
    <text x="32" y="88" class="sans title">Frontend</text>
    <text x="32" y="118" class="sans body" fill="#C9D1D9">TypeScript &amp; JavaScript</text>
    <text x="32" y="146" class="sans body" fill="#C9D1D9">React &amp; Next.js</text>
    <text x="32" y="174" class="sans body" fill="#C9D1D9">Tailwind CSS &amp; Motion</text>
    <text x="32" y="202" class="sans body" fill="#C9D1D9">HTML5, CSS3 &amp; Vite</text>

    <line x1="316" y1="72" x2="316" y2="228" stroke="#21262D" stroke-width="1"/>

    <!-- Col 2 -->
    <text x="340" y="88" class="sans title">Backend</text>
    <text x="340" y="118" class="sans body" fill="#C9D1D9">Node.js &amp; Express</text>
    <text x="340" y="146" class="sans body" fill="#C9D1D9">Java OOP &amp; Collections</text>
    <text x="340" y="174" class="sans body" fill="#C9D1D9">PHP &amp; Laravel</text>
    <text x="340" y="202" class="sans body" fill="#C9D1D9">Python &amp; REST APIs</text>

    <line x1="624" y1="72" x2="624" y2="228" stroke="#21262D" stroke-width="1"/>

    <!-- Col 3 -->
    <text x="648" y="88" class="sans title">Databases</text>
    <text x="648" y="118" class="sans body" fill="#C9D1D9">PostgreSQL</text>
    <text x="648" y="146" class="sans body" fill="#C9D1D9">MySQL &amp; MariaDB</text>
    <text x="648" y="174" class="sans body" fill="#C9D1D9">MongoDB</text>
    <text x="648" y="202" class="sans body" fill="#C9D1D9">Prisma ORM &amp; GraphQL</text>

    <line x1="912" y1="72" x2="912" y2="228" stroke="#21262D" stroke-width="1"/>

    <!-- Col 4 -->
    <text x="936" y="88" class="sans title">Workflow &amp; AI</text>
    <text x="936" y="118" class="sans body" fill="#C9D1D9">Graphify Knowledge Graph</text>
    <text x="936" y="146" class="sans body" fill="#C9D1D9">Git, GitHub &amp; Docker</text>
    <text x="936" y="174" class="sans body" fill="#C9D1D9">Linux CLI &amp; Vercel</text>
    <text x="936" y="202" class="sans body" fill="#C9D1D9">VS Code &amp; Eclipse</text>
  </g>
</svg>