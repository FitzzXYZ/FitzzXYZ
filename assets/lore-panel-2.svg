<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260">
  <defs>
    <clipPath id="lp2"><rect x="0" y="0" width="460" height="260" rx="12"/></clipPath>
    <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Geist Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  .h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.8px; fill: #F0F6FC; }
  .h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; fill: #F0F6FC; }
  .title { font-size: 15px; font-weight: 600; fill: #F0F6FC; }
  .body { font-size: 14px; font-weight: 400; fill: #9CA3AF; }
  .caption { font-size: 12px; font-weight: 500; fill: #6E7681; }
</style>
  </defs>
  <g clip-path="url(#lp2)">
    <rect x="0.5" y="0.5" width="459" height="259" rx="11.5" fill="#14181D" stroke="#242B33" stroke-width="1"/>

    <text x="24" y="38" class="sans h2">Reelseiden: cutting through complexity</text>
    <text x="24" y="64" class="sans" font-size="13.5" fill="#9CA3AF">Übel’s spell cuts effortlessly through stone because she grew up</text>
    <text x="24" y="84" class="sans" font-size="13.5" fill="#9CA3AF">watching tailor’s shears glide through cloth.</text>

    <!-- 3 Clean Tinted Wells (no borders) -->
    <rect x="24" y="102" width="412" height="42" rx="6" fill="#1A2028"/>
    <text x="38" y="120" class="sans" font-size="12.5" font-weight="600" fill="#F0F6FC">1. Trace the data flow</text>
    <text x="38" y="136" class="sans" font-size="12" fill="#8B949E">Map state from PostgreSQL and MySQL through APIs to the UI.</text>

    <rect x="24" y="150" width="412" height="42" rx="6" fill="#1A2028"/>
    <text x="38" y="168" class="sans" font-size="12.5" font-weight="600" fill="#F0F6FC">2. Remove unnecessary abstraction</text>
    <text x="38" y="184" class="sans" font-size="12" fill="#8B949E">Keep components, schemas, and Java OOP hierarchies lean.</text>

    <rect x="24" y="198" width="412" height="42" rx="6" fill="#1A2028"/>
    <text x="38" y="216" class="sans" font-size="12.5" font-weight="600" fill="#F0F6FC">3. Ship with precision</text>
    <text x="38" y="232" class="sans" font-size="12" fill="#8B949E">Pair type-safe TypeScript and backend logic with fluid motion.</text>
  </g>
</svg>