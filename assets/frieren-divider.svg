<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="100%" height="100%">
  <defs>
    <linearGradient id="div_left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A843" stop-opacity="0"/>
      <stop offset="65%" stop-color="#8BA872" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E5C068" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="div_right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C068" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#B399EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D4A843" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Tapering Illuminated Manuscript Rules -->
  <line x1="60" y1="16" x2="564" y2="16" stroke="url(#div_left)" stroke-width="1"/>
  <line x1="636" y1="16" x2="1140" y2="16" stroke="url(#div_right)" stroke-width="1"/>

  <!-- Delicate Flanking Diamonds -->
  <polygon points="548,13 551,16 548,19 545,16" fill="#9CC084">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="652,13 655,16 652,19 649,16" fill="#B399EE">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </polygon>

  <!-- Central Rotating Celestial Astrolabe Star -->
  <circle cx="600" cy="16" r="11" fill="none" stroke="#D4A843" stroke-opacity="0.4" stroke-width="0.9" stroke-dasharray="3 3">
    <animateTransform attributeName="transform" type="rotate" from="0 600 16" to="360 600 16" dur="28s" repeatCount="indefinite"/>
  </circle>
  <g>
    <polygon points="600,7 602.4,13.6 609,16 602.4,18.4 600,25 597.6,18.4 591,16 597.6,13.6" fill="#E5C068" fill-opacity="0.9"/>
    <animateTransform attributeName="transform" type="rotate" from="360 600 16" to="0 600 16" dur="36s" repeatCount="indefinite"/>
  </g>
  <circle cx="600" cy="16" r="2.2" fill="#F4EFE6"/>
</svg>
